<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SymptomSense</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/medi.css') }}">
</head>
<body>
    <div id="nav-placeholder"></div>
    <div class="container">
        <h1>MediTrack</h1>
        <p>Search for medicines to find uses, side effects, and substitutes.</p>
        
        <div class="search-container">
            <label for="med">Enter medicine name:</label>
            <input type="text" id="med" placeholder="e.g., paracetamol">
            <button id="search-btn">Search</button>
        </div>
        
        <div class="loading" id="loading">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <style>
                    .spinner {
                        animation: rotate 2s linear infinite;
                        transform-origin: center;
                    }
                    .path {
                        stroke: #2e8b57;
                        stroke-width: 4;
                        stroke-linecap: round;
                        animation: dash 1.5s ease-in-out infinite;
                    }
                    @keyframes rotate {
                        100% {
                            transform: rotate(360deg);
                        }
                    }
                    @keyframes dash {
                        0% {
                            stroke-dasharray: 1, 150;
                            stroke-dashoffset: 0;
                        }
                        50% {
                            stroke-dasharray: 90, 150;
                            stroke-dashoffset: -35;
                        }
                        100% {
                            stroke-dasharray: 90, 150;
                            stroke-dashoffset: -124;
                        }
                    }
                </style>
                <circle class="spinner path" cx="12" cy="12" r="10" fill="none"></circle>
            </svg>
            Searching medicines...
        </div>
        
        <div class="results" id="results"></div>
    </div>

    <script src="{{ url_for('static', filename='scripts/mediScript.js') }}"">
        
    </script>
</body>
</html>
