<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', 'Inter', sans-serif;
}
/* Sticky navbar */
.navbar {
  background-color: #4BA3DA;
  padding: 12px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  width: 100%;
  z-index: 1000;
}

/* Logo section */
.logo {
  font-size: 22px;
  font-weight: 600;
  display: flex;
  align-items: center;
  color: black;
}

.logo img {
  width: 35px;
  height: auto;
  margin-right: 12px;
}

/* Links + Buttons (Desktop View) */
.links-container {
  display: flex;
  align-items: center;
  gap: 25px;
  text-align: center;
}
.links-container a {
  display: flex;
  align-items: center;
  text-decoration: none;
  color: white;
  font-weight: bold;
  font-size: 1rem;
  text-transform: uppercase;
  padding: 0;
}

/* Buttons */
.buttons {
  display: flex;
  gap: 15px;
}

.buttons button {
  background: black;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 5px;
  font-size: 1rem;
  cursor: pointer;
}

/* Sidebar Toggle Button - Hidden by default */
#sidebar-active {
  display: none;
}

.open-sidebar-button,
.close-sidebar-button {
  display: none;
  cursor: pointer;
  font-size: 1.5rem;
  color: white;
  background: none;
  border: none;
}

/* Overlay behind sidebar */
#overlay {
  display: none;
}

/* -------------------- Mobile Styles -------------------- */
@media (max-width: 768px) {
  .navbar {
    padding: 10px 20px;
  }

  .logo {
    font-size: 16px;
  }

  .open-sidebar-button {
    display: block;
  }

  .links-container {
    flex-direction: column;
    align-items: flex-start;
    position: fixed;
    top: 0;
    right: -100%;
    width: 50%; /* Half screen sidebar */
    height: 100%;
    background-color: #4BA3DA;
    padding: 20px;
    gap: 20px;
    z-index: 10;
    transition: right 0.3s ease-in-out;
  }

  #sidebar-active:checked ~ .links-container {
    right: 0;
  }

  #sidebar-active:checked ~ #overlay {
    display: block;
    position: fixed;
    height: 100%;
    width: 100%;
    top: 0;
    left: 0;
    z-index: 9;
  }

  .close-sidebar-button {
    display: block;
    align-self: flex-end;
    font-size: 1.5rem;
    color: white;
  }

  .links-container a {
    width: auto;
    padding: 10px 0;
    font-size: 0.95rem;
    font-weight: bold;
  }

  .buttons {
    flex-direction: column;
    width: auto; /* Match links width */
    gap: 10px;
  }

  .buttons button {
    width: auto;
    padding: 8px 16px;
    font-size: 0.9rem;
  }
}
</style>
<nav class="navbar">
  <div class="logo">
    <img src="https://cdn-icons-png.flaticon.com/512/2544/2544036.png" alt="logo" />
    SYMPTOMSENSE
  </div>

  <input type="checkbox" id="sidebar-active" />
  <label for="sidebar-active" class="open-sidebar-button">
    &#9776;
  </label>

  <label id="overlay" for="sidebar-active"></label>

  <div class="links-container">
    <label for="sidebar-active" class="close-sidebar-button">✕</label>
    <a href="/">HOME</a>
    <a href="#">COMMUNITY</a>
    <a href="/chatbot">MIND MATE</a>
    <div class="buttons">
      <button>Sign-in</button>
      <button onclick="window.location.href='/login'">Login</button>
    </div>
  </div>
</nav>
